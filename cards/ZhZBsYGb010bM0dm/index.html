<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Boo Basket Card</title><style>*{margin:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(160deg,#1a0f2e 0%,#2d1b4e 50%,#4a2c6e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:420px;width:100%;background:rgba(255,255,255,.97);border-radius:24px;padding:40px 32px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.eyebrow{text-align:center;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#8b5cf6;font-weight:600;margin-bottom:8px}
h1{text-align:center;font-size:28px;color:#2d1b4e;margin-bottom:4px}
.sub{text-align:center;font-size:15px;color:#6b7280;margin-bottom:28px}
.row{margin-bottom:20px}
.label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#9ca3af;font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#f3e8ff;color:#6d28d9;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px}
.note{background:#fef9c3;border-radius:12px;padding:12px 14px;font-size:14px;color:#713f12}
.foot{text-align:center;margin-top:28px;font-size:13px;color:#9ca3af;font-style:italic}</style></head><body><div class="card">
<div class="eyebrow">🎃 Boo Basket Exchange</div>
<h1>Your Basket Recipient</h1>
<div class="sub">Keep this between us 🤫</div>
<div class="row"><div class="label">Making a basket for</div><h1 style="font-size:24px;margin:0">Latasha Woodard</h1></div>
<div class="row"><div class="label">Treat Preferences</div><div class="chips"><span class="chip">[</span><span class="chip">&quot;</span><span class="chip">C</span><span class="chip">o</span><span class="chip">z</span><span class="chip">y</span><span class="chip"> </span><span class="chip">&amp;</span><span class="chip"> </span><span class="chip">S</span><span class="chip">e</span><span class="chip">l</span><span class="chip">f</span><span class="chip">-</span><span class="chip">C</span><span class="chip">a</span><span class="chip">r</span><span class="chip">e</span><span class="chip">&quot;</span><span class="chip">,</span><span class="chip">&quot;</span><span class="chip">B</span><span class="chip">e</span><span class="chip">a</span><span class="chip">u</span><span class="chip">t</span><span class="chip">y</span><span class="chip"> </span><span class="chip">&amp;</span><span class="chip"> </span><span class="chip">G</span><span class="chip">i</span><span class="chip">r</span><span class="chip">l</span><span class="chip">y</span><span class="chip">&quot;</span><span class="chip">]</span></div></div>
<div class="row"><div class="label">⚠️ Allergies / Avoid</div><div class="note">⚠️ Don&#x27;t like pumpkin or cinnamon scents</div></div>
<div class="foot">Happy haunting! 👻</div>
</div></body></html>
